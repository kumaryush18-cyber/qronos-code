# Build one platform package of Qronos Code.
#
# The same steps run in the first build pass and in the retry pass, so they
# live here once. Both callers pass a target from the publish matrix.
#
#   linux-x64     ubuntu-latest
#   linux-arm64   ubuntu-latest (cross build)
#   win32-x64     windows-latest
#   darwin-arm64  ubuntu-latest (cross build)
#   darwin-x64    ubuntu-latest (cross build)
#
# Signing is optional and driven by the job environment, never by this file:
#
#   macOS   APPLE_CERT_P12 (base64 .p12), APPLE_CERT_PASSWORD,
#           APPLE_API_ISSUER, APPLE_API_KEY_ID, APPLE_API_KEY_P8 (base64 .p8)
#   Windows WINDOWS_CERT_PFX (base64 .pfx), WINDOWS_CERT_PASSWORD
#
# When a value is missing the matching step prints why it skipped and the
# package is published unsigned, exactly as before.
name: build qronos-code vsix
description: Compile the CLI binary, bundle the extension, package one platform target.

inputs:
  target:
    description: Marketplace target triple, for example linux-x64
    required: true
  build-target:
    description: Pass to QRONOS_BUILD_TARGET when the package is cross-built (darwin-arm64 on Linux)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4

    - name: Install dependencies
      shell: bash
      run: bun install

    # The Linux CLI build compiles the bubblewrap sandbox helper with Zig;
    # without it the build silently falls back to a dev wrapper script.
    - name: Setup Zig for the Linux sandbox helper
      if: runner.os == 'Linux' && inputs.target == 'linux-x64'
      shell: bash
      run: |
        curl --fail --location --retry 3 \
          https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
          --output "$RUNNER_TEMP/zig.tar.xz"
        echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --status
        tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"

    - name: Build the CLI binary
      shell: bash
      working-directory: packages/extension
      env:
        QRONOS_BUILD_TARGET: ${{ inputs.build-target }}
      run: bun run prepare:cli-binary

    - name: Verify the binary is real
      shell: bash
      working-directory: packages/extension
      run: |
        size=$(wc -c < bin/qronos || wc -c < bin/qronos.exe)
        echo "binary size: $size bytes"
        if [ "$size" -lt 10000000 ]; then
          echo "::error::bin/qronos is only $size bytes - that is a dev wrapper"
          exit 1
        fi

    # Signing a macOS binary needs a Mac, and a Mac runner is not available on
    # this account, so the cross build is signed with rcodesign instead.
    # Notarization only accepts a bundle, so the binary is wrapped in a minimal
    # .app, signed, notarized and stapled, then copied back out: Apple keeps the
    # ticket for that hash and Gatekeeper finds it online.
    - name: Sign and notarize the macOS binary
      if: startsWith(inputs.target, 'darwin') && env.APPLE_CERT_P12 != ''
      shell: bash
      working-directory: packages/extension
      env:
        APPLE_CERT_P12: ${{ env.APPLE_CERT_P12 }}
        APPLE_CERT_PASSWORD: ${{ env.APPLE_CERT_PASSWORD }}
        APPLE_API_ISSUER: ${{ env.APPLE_API_ISSUER }}
        APPLE_API_KEY_ID: ${{ env.APPLE_API_KEY_ID }}
        APPLE_API_KEY_P8: ${{ env.APPLE_API_KEY_P8 }}
      run: |
        set -euo pipefail
        work="$RUNNER_TEMP/sign"
        mkdir -p "$work"
        curl --fail --location --retry 3 \
          https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.29.0/apple-codesign-0.29.0-x86_64-unknown-linux-musl.tar.gz \
          --output "$work/rcodesign.tar.gz"
        tar -xzf "$work/rcodesign.tar.gz" -C "$work"
        rcodesign="$(find "$work" -name rcodesign -type f | head -1)"
        chmod +x "$rcodesign"

        printf '%s' "$APPLE_CERT_P12" | base64 -d > "$work/cert.p12"
        printf '%s' "$APPLE_CERT_PASSWORD" > "$work/cert-password.txt"
        printf '%s' "$APPLE_API_KEY_P8" | base64 -d > "$work/key.p8"
        "$rcodesign" encode-app-store-connect-api-key \
          --issuer "$APPLE_API_ISSUER" --key "$work/key.p8" -o "$work/api-key.json"

        app="$work/Qronos.app"
        mkdir -p "$app/Contents/MacOS"
        cp bin/qronos "$app/Contents/MacOS/qronos"
        cp bin/qronos "$app/Contents/MacOS/qronos.program"
        cat > "$app/Contents/Info.plist" <<'PLIST'
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict>
          <key>CFBundleExecutable</key><string>qronos.program</string>
          <key>CFBundleIdentifier</key><string>me.qronos.code.cli</string>
          <key>CFBundleName</key><string>Qronos</string>
          <key>CFBundleShortVersionString</key><string>1.0.0</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>LSUIElement</key><true/>
        </dict></plist>
        PLIST

        "$rcodesign" sign --for-notarization --code-signature-flags runtime \
          --p12-file "$work/cert.p12" --p12-password-file "$work/cert-password.txt" "$app"
        "$rcodesign" notary-submit --api-key-file "$work/api-key.json" --staple "$app"

        cp "$app/Contents/MacOS/qronos" bin/qronos
        chmod +x bin/qronos
        rm -rf "$work"
        echo "signed and notarized ${{ inputs.target }}"

    - name: Skip macOS signing (no certificate)
      if: startsWith(inputs.target, 'darwin') && env.APPLE_CERT_P12 == ''
      shell: bash
      run: echo "::notice::APPLE_CERT_P12 is not set, so ${{ inputs.target }} ships unsigned"

    - name: Sign the Windows binary
      if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
      shell: pwsh
      working-directory: packages/extension
      env:
        WINDOWS_CERT_PFX: ${{ env.WINDOWS_CERT_PFX }}
        WINDOWS_CERT_PASSWORD: ${{ env.WINDOWS_CERT_PASSWORD }}
      run: |
        $pfx = Join-Path $env:RUNNER_TEMP 'cert.pfx'
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
        $signtool = (Get-ChildItem "$env:ProgramFiles\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
          Where-Object { $_.FullName -match 'x64' } | Select-Object -Last 1).FullName
        & $signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
          /tr http://timestamp.digicert.com /td SHA256 `
          "bin/qronos.exe"
        if ($LASTEXITCODE -ne 0) { throw "signtool failed with $LASTEXITCODE" }
        & $signtool verify /pa "bin/qronos.exe"
        if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with $LASTEXITCODE" }
        Remove-Item $pfx -Force
        echo "signed win32-x64"

    - name: Skip Windows signing (no certificate)
      if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX == ''
      shell: bash
      run: echo "::notice::WINDOWS_CERT_PFX is not set, so win32-x64 ships unsigned"

    # A compiled binary can build fine and still die on its first request.
    # A cross-built binary cannot run on this runner, so only the native
    # Linux package is exercised.
    - name: Smoke test the server
      if: inputs.target == 'linux-x64'
      shell: bash
      working-directory: packages/extension
      run: |
        ./bin/qronos serve --port 4599 > "$RUNNER_TEMP/serve.log" 2>&1 &
        pid=$!
        for i in $(seq 1 40); do
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4599/qronos/profile || true)
          if [ "$code" != "000" ] && [ -n "$code" ]; then break; fi
          sleep 1
        done
        echo "status: $code"
        kill "$pid" 2>/dev/null || true
        if [ "$code" = "000" ] || [ -z "$code" ]; then
          echo "::error::the compiled CLI did not answer /qronos/profile (got '$code')"
          tail -30 "$RUNNER_TEMP/serve.log"
          exit 1
        fi

    - name: Prepare the SDK
      shell: bash
      working-directory: packages/extension
      run: bun run prepare:sdk

    - name: Bundle extension and webview
      shell: bash
      working-directory: packages/extension
      run: bun esbuild.js

    - name: Package
      shell: bash
      working-directory: packages/extension
      run: >
        bunx @vscode/vsce package
        --no-dependencies
        --allow-missing-repository
        --target ${{ inputs.target }}
        -o qronos-code-${{ inputs.target }}.vsix

    - name: Report the package size
      shell: bash
      working-directory: packages/extension
      run: |
        bytes=$(wc -c < qronos-code-${{ inputs.target }}.vsix)
        echo "### ${{ inputs.target }}: $((bytes / 1048576)) MB" >> "$GITHUB_STEP_SUMMARY"
