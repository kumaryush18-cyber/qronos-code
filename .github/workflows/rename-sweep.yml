name: rename-sweep

# Gate for the whole rebrand: no old scope, package name or word may survive.
#
# Two exceptions are allowed on purpose and nowhere else:
#   - LICENSE / NOTICE / packages/*/LICENSE / packages/*/NOTICE: MIT requires the
#     original copyright notice to stay, so the old name must appear there.
#   - packages/cli/src/provider/models.ts: removes the dead third-party catalogue
#     entry published under the old name. That is data cleanup, never branding.
#
# Runs in seconds, so it fails before a broken vsix can be built.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No old package scopes left
        run: |
          set +e
          hits=$(grep -rn "@kilocode/\|@opencode-ai/" \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
            --exclude-dir=.github --exclude-dir=.qronos . | head -20)
          [ -n "$hits" ] && { echo "$hits"; exit 1; }
          echo "clean"

      - name: No old product word left in code or docs
        run: |
          set +e
          hits=$(grep -rIni "kilocode\|\bkilo\b" \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
            --exclude-dir=.github --exclude-dir=.qronos . \
            | grep -v -E "^(\./)?(packages/[^/]+/)?(LICENSE|NOTICE):" \
            | grep -v -E "^(\./)?packages/cli/src/provider/models\.ts:" \
            | head -20)
          [ -n "$hits" ] && { echo "Old name still present:"; echo "$hits"; exit 1; }
          echo "clean"

      - name: Package names
        run: |
          set +e
          bad=$(for f in package.json packages/*/package.json packages/sdk/js/package.json; do
                  jq -r .name "$f"; done | grep -v '@qronos-ai/\|^qronos-code$' | head -10)
          [ -n "$bad" ] && { echo "Unexpected package name:"; echo "$bad"; exit 1; }
          echo "clean"

      - name: No old name in any tracked path
        run: |
          set +e
          bad=$(git ls-files | grep -i "kilo" | head -10)
          [ -n "$bad" ] && { echo "Old name in path:"; echo "$bad"; exit 1; }
          echo "clean"

  install:
    # A clean install is the real proof the rename is consistent: bun resolves
    # every workspace link from the package names, so a name/import mismatch
    # fails here instead of at runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: bun install
        run: bun install --no-save
      - name: typecheck extension host
        working-directory: packages/extension
        run: bun run check-types
      - name: typecheck webview
        working-directory: packages/extension
        run: bun run check-types:webview
