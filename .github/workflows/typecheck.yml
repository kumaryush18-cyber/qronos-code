# Qronos Code — typecheck the whole monorepo on a GitHub runner.
#
# Why this exists: the full typecheck spawns ~20 compiler processes at once
# (TypeScript, plus Gradle/Kotlin for the JetBrains plugin). That is fine on a
# CI runner and painful on a small dev container, so the check lives here.
#
# The JetBrains plugin is excluded: its Gradle build needs network mirrors and
# does not belong in a five-minute gate.
name: typecheck

on:
  workflow_dispatch:
  push:
    branches: [main, "chore/**"]
  pull_request:

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --no-save

      - name: Typecheck every package except the JetBrains plugin
        run: bun turbo typecheck --filter='!@qronos-ai/jetbrains'
