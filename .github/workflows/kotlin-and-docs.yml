name: kotlin-and-docs-check

# The Kotlin plugin namespace moved from ai.kilocode to ai.qronos and the docs
# site was rewritten, so both need a compile gate of their own. Neither ships in
# the VS Code extension, so they run separately from the vsix matrix.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: bun install
        run: bun install --no-save
      - name: Setup Zig for the Linux sandbox helper
        run: |
          curl --fail --location --retry 3 \
            https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz \
            --output "$RUNNER_TEMP/zig.tar.xz"
          echo "473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982  $RUNNER_TEMP/zig.tar.xz" | sha256sum --check --status
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-x86_64-0.14.0" >> "$GITHUB_PATH"
      # stageRepoCli only runs after buildRepoCli; nothing triggers that task, so
      # the binary has to exist before Gradle starts.
      - name: build the CLI for this platform
        working-directory: packages/cli
        run: bun run script/build.ts --single --skip-install
      - name: compile the JetBrains plugin
        working-directory: packages/jetbrains
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon -Dorg.gradle.vfs.watch=false -Pqronos.cli.pinned=false -q :compileKotlin :compileTestKotlin

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: bun install
        run: bun install --no-save
      - name: build the docs site
        working-directory: packages/docs
        run: bun run build
