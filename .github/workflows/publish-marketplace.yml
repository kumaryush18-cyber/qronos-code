# Qronos Code — publish to the VS Code Marketplace on every push to main.
#
# How it decides what to do:
#   1. Read the version from packages/extension/package.json.
#   2. Ask the Marketplace whether that exact version already exists.
#      - missing -> build five platform packages and publish them
#      - exists  -> bump the patch version, commit it with [skip bump] and push.
#                   That push starts a fresh run whose version is missing, so
#                   every push ends up as a new published version.
#   3. Without a VSCE_PAT secret (and without trusted publishing) the run builds
#      and uploads artifacts only, and says so plainly.
#
# Platform coverage: linux-x64, linux-arm64, win32-x64, darwin-arm64 and
# darwin-x64. The macOS builds are cross-compiled on Linux, so a throttled
# macOS runner cannot block them. A second "retry" pass rebuilds only the
# targets whose artifact is missing; the publish step names anything still
# missing.
#
# One-time setup before the first real publish:
#   - create the publisher "qronos-ai" at https://marketplace.visualstudio.com/manage
#   - add the token as the repository secret VSCE_PAT (never commit it)
name: publish-marketplace

on:
  push:
    branches: [main]
    paths:
      - "packages/extension/package.json"
      - "packages/extension/src/**"
      - "packages/extension/webview-ui/src/**"
      - "packages/extension/assets/**"
      - "packages/cli/src/**"
      - "packages/sdk/js/src/**"
  workflow_dispatch:

concurrency:
  group: publish-marketplace-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISHER: qronos-ai
  EXTENSION: qronos-code

jobs:
  gate:
    name: decide
    runs-on: ubuntu-latest
    permissions:
      contents: write # the version bump is committed back to main
      actions: write # and a fresh run is dispatched for it
    outputs:
      version: ${{ steps.read.outputs.version }}
      publish: ${{ steps.check.outputs.publish }}
      bumped: ${{ steps.bump.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Read the version
        id: read
        run: |
          version=$(node -p "require('./packages/extension/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "extension version: $version"

      - name: Is this version already live?
        id: check
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          TRUSTED_PUBLISHING: ${{ vars.TRUSTED_PUBLISHING }}
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if [ -z "$VSCE_PAT" ] && [ "$TRUSTED_PUBLISHING" != "true" ]; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
            echo "reason=no-token" >> "$GITHUB_OUTPUT"
            echo "::notice::no VSCE_PAT secret and no TRUSTED_PUBLISHING variable - building only, nothing will be published."
            exit 0
          fi
          url="https://marketplace.visualstudio.com/_apis/public/gallery/publishers/$PUBLISHER/vsextensions/$EXTENSION/$VERSION/vspackage"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo 000)
          echo "marketplace lookup for $VERSION: HTTP $code"
          if [ "$code" = "200" ]; then
            echo "publish=no" >> "$GITHUB_OUTPUT"
            echo "reason=already-live" >> "$GITHUB_OUTPUT"
            echo "::notice::$EXTENSION $VERSION is live already - a patch bump will be committed next."
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
            echo "reason=missing" >> "$GITHUB_OUTPUT"
          fi

      # The Marketplace refuses to overwrite a version, so a push that does not
      # change the version would publish nothing. Bump the patch number here and
      # push it; the push triggers this same workflow with a version that is not
      # live yet, which is the run that publishes. [skip bump] stops a loop if
      # the bump commit itself ever lands on an already-live version.
      - name: Bump the patch version when this one is already live
        id: bump
        if: steps.check.outputs.reason == 'already-live'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git log -1 --pretty=%B | grep -q "\[skip bump\]"; then
            echo "bumped=no" >> "$GITHUB_OUTPUT"
            echo "::notice::the last commit is a version bump - not bumping again."
            exit 0
          fi
          current=$(node -p "require('./packages/extension/package.json').version")
          next=$(node -p "const v='$current'.split('.').map(Number); v[2]+=1; v.join('.')")
          node -e "
            const fs = require('fs');
            const path = 'packages/extension/package.json';
            const raw = fs.readFileSync(path, 'utf8');
            fs.writeFileSync(path, raw.replace('\"version\": \"$current\"', '\"version\": \"$next\"'));
          "
          grep -q "\"version\": \"$next\"" packages/extension/package.json
          git config user.name "qronos-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git commit -am "chore(release): v$next [skip bump]"
          git push origin HEAD:main
          echo "bumped=yes" >> "$GITHUB_OUTPUT"
          echo "::notice::committed v$next"

      # A push made with GITHUB_TOKEN does not start workflows, so the bump
      # commit needs an explicit dispatch. The dispatched run reads the new
      # version, finds it missing on the Marketplace and publishes it.
      - name: Start the run that publishes the bumped version
        if: steps.bump.outputs.bumped == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run publish-marketplace.yml --ref main
          echo "::notice::dispatched publish-marketplace for the bumped version"

  build:
    name: build ${{ matrix.target }}
    needs: gate
    if: needs.gate.outputs.publish == 'yes'
    runs-on: ${{ matrix.os }}
    # Signing is optional: an empty secret makes the build step skip and the
    # package ships unsigned. Nothing here is required to publish.
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    # A target that cannot get a runner must not hold back the platforms that
    # did build; the retry pass below rebuilds whatever is still missing.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            build-target: ""
          - os: ubuntu-latest
            target: linux-arm64
            build-target: linux-arm64
          - os: windows-latest
            target: win32-x64
            build-target: ""
          - os: ubuntu-latest
            target: darwin-arm64
            build-target: darwin-arm64
          - os: ubuntu-latest
            target: darwin-x64
            build-target: darwin-x64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: ./.github/actions/build-vsix
        with:
          target: ${{ matrix.target }}
          build-target: ${{ matrix.build-target }}

      - uses: actions/upload-artifact@v4
        with:
          name: qronos-code-${{ matrix.target }}
          path: packages/extension/qronos-code-${{ matrix.target }}.vsix
          if-no-files-found: error
          retention-days: 14

  # Second chance for a platform whose runner was throttled in the first pass.
  # Each target checks whether its package exists and only rebuilds when it does
  # not, so a healthy run does no extra work.
  build-retry:
    name: retry ${{ matrix.target }}
    needs: [gate, build]
    if: always() && needs.gate.outputs.publish == 'yes'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            build-target: ""
          - os: ubuntu-latest
            target: linux-arm64
            build-target: linux-arm64
          - os: windows-latest
            target: win32-x64
            build-target: ""
          - os: ubuntu-latest
            target: darwin-arm64
            build-target: darwin-arm64
          - os: ubuntu-latest
            target: darwin-x64
            build-target: darwin-x64
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Is the package already here?
        id: have
        shell: bash
        run: |
          if [ -n "$(ls -A packages/extension/*.vsix 2>/dev/null || true)" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          fi

      - id: fetch
        if: steps.have.outputs.present != 'yes'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qronos-code-${{ matrix.target }}
          path: existing

      - id: check
        shell: bash
        run: |
          if [ -n "$(ls -A existing 2>/dev/null || true)" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.target }} was built in the first pass - nothing to retry"
          else
            echo "::notice::${{ matrix.target }} is missing - rebuilding it now"
          fi

      - if: steps.check.outputs.present != 'yes'
        uses: ./.github/actions/build-vsix
        with:
          target: ${{ matrix.target }}
          build-target: ${{ matrix.build-target }}

      - if: steps.check.outputs.present != 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: qronos-code-${{ matrix.target }}
          path: packages/extension/qronos-code-${{ matrix.target }}.vsix
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish:
    name: publish to the Marketplace
    needs: [gate, build, build-retry]
    # A failed retry must not hide the packages that did build.
    if: always() && needs.gate.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # trusted publishing: no PAT to store or rotate
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: vsix

      - name: Publish each platform
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          # Trusted publishing (Marketplace → Trusted Publishing) needs no
          # secret: the workflow requests a 15-minute OIDC token instead. A PAT
          # still works if one is stored, so both paths stay supported.
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "authenticating with OIDC trusted publishing"
            AUTH="--oidc"
          else
            echo "authenticating with the VSCE_PAT secret"
            AUTH=""
          fi
          # The Marketplace wants one publish per platform target for the same
          # version; the first one creates the version, the others attach the
          # remaining platforms to it. Order does not matter, retries do.
          for target in linux-x64 linux-arm64 win32-x64 darwin-arm64 darwin-x64; do
            file=$(find vsix -name "qronos-code-$target.vsix" | head -1)
            if [ -z "$file" ]; then
              echo "::warning::no package for $target (its runner did not finish) - skipping it"
              echo "- $target: skipped, build did not finish" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            echo "publishing $target ($(wc -c < "$file") bytes)"
            for attempt in 1 2 3; do
              # The target is already inside the package, and vsce refuses
              # --packagePath together with --target, so pass the path only.
              if npx --yes @vscode/vsce publish $AUTH --packagePath "$file" --githubBranch main; then
                break
              fi
              if [ "$attempt" = "3" ]; then
                echo "::error::publishing $target failed three times"
                exit 1
              fi
              echo "retrying $target in 20s (attempt $attempt failed)"
              sleep 20
            done
          done
          echo "### published $PUBLISHER.$EXTENSION $VERSION" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: github release
    needs: [gate, publish]
    if: needs.gate.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: vsix

      - name: Attach the installers to a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          name: Qronos Code ${{ needs.gate.outputs.version }}
          draft: false
          files: vsix/**/*.vsix
          body: |
            Qronos Code ${{ needs.gate.outputs.version }}

            Install a platform package, then sign in with GitHub inside the panel.
