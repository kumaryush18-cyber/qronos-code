name: "Qronos GitHub Action"
description: "Run Qronos AI agent in GitHub Actions workflows"
branding:
  icon: "code"
  color: "gray-dark"

inputs:
  model:
    description: "Model to use"
    required: true

  agent:
    description: "Agent to use. Must be a primary agent. Falls back to default_agent from config or 'build' if not found."
    required: false

  share:
    description: "Share the Qronos session (defaults to true for public repos)"
    required: false

  prompt:
    description: "Custom prompt to override the default prompt"
    required: false

  use_github_token:
    description: "Use GITHUB_TOKEN directly instead of Qronos App token exchange. When true, skips OIDC and uses the GITHUB_TOKEN env var."
    required: false
    default: "false"

  mentions:
    description: "Comma-separated list of trigger phrases (case-insensitive). Defaults to '/qronos,/kc'"
    required: false

  variant:
    description: "Model variant for provider-specific reasoning effort (e.g., high, max, minimal)"
    required: false

  oidc_base_url:
    description: "Base URL for OIDC token exchange API. Only required when running a custom GitHub App install. Defaults to https://api.qronos.me"
    required: false

  qronos_api_key:
    description: "Qronos API key for gateway authentication"
    required: false

  qronos_org_id:
    description: "Qronos organization ID"
    required: false

runs:
  using: "composite"
  steps:
    - name: Get Qronos version
      id: version
      shell: bash
      run: |
        VERSION=$(curl -sf https://api.github.com/repos/Qronos-Org/qronos/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
        echo "version=${VERSION:-latest}" >> $GITHUB_OUTPUT

    - name: Cache Qronos
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.qronos/bin
        key: qronos-${{ runner.os }}-${{ runner.arch }}-${{ steps.version.outputs.version }}

    - name: Install Qronos
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: curl -fsSL https://qronos.me/cli/install | bash

    - name: Add Qronos to PATH
      shell: bash
      run: echo "$HOME/.qronos/bin" >> $GITHUB_PATH

    - name: Run Qronos
      shell: bash
      id: run_qronos
      run: qronos github run
      env:
        MODEL: ${{ inputs.model }}
        AGENT: ${{ inputs.agent }}
        SHARE: ${{ inputs.share }}
        PROMPT: ${{ inputs.prompt }}
        USE_GITHUB_TOKEN: ${{ inputs.use_github_token }}
        MENTIONS: ${{ inputs.mentions }}
        VARIANT: ${{ inputs.variant }}
        OIDC_BASE_URL: ${{ inputs.oidc_base_url }}
        QRONOS_API_KEY: ${{ inputs.qronos_api_key }}
        QRONOS_ORG_ID: ${{ inputs.qronos_org_id }}
